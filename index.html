    <meta name="description" content="Simplifique o fluxo de caixa, comissões de colaboradores, cobranças recorrentes e automação financeira." />

    <link rel="icon" type="image/png" href="/favicon-symbol.png" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="Previna | Gestão Financeira" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Trata erros de chunks antigos após deploys do Vite
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('[Vite] Preload error detected, reloading page...', event);
        window.location.reload();
      });

      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Novo service worker ativo, recarrega para pegar a versão atualizada
                    window.location.reload();
                  }
                };
              }
            };
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
